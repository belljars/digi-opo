<!doctype html>
<html lang="fi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>digi-opo - Opintopolku-kysely</title>
        <script>
            (() => {
              const storageKey = "digi-opo.theme-mode";
              const isThemeMode = (value) => value === "auto" || value === "light" || value === "dark";
              let mode = "auto";
              try {
                const storedValue = window.localStorage.getItem(storageKey);
                if (isThemeMode(storedValue)) {
                  mode = storedValue;
                }
              } catch {
                mode = "auto";
              }
            
              const effectiveTheme = mode === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                : mode;
            
              document.documentElement.dataset.themeMode = mode;
              document.documentElement.dataset.theme = effectiveTheme;
              document.documentElement.style.colorScheme = effectiveTheme;
            })();
        </script>
        <link rel="stylesheet" href="../styles/styles.css" />
    </head>
    <a class="skip-link" href="#main-content">Siirry sisältöön</a>
    <main class="app" id="main-content">
        <section class="panel panel-quiz">
            <header class="quiz-header">
                <div>
                    <h2>Opintopolku-kysely</h2>
                    <p class="quiz-lead">Vastaukset tallentuvat myös kesken kaiken, joten voit jatkaa myöhemmin.</p>
                </div>
                <button id="quiz-restart" type="button">Aloita alusta</button>
            </header>
            <section class="quiz-overview" aria-label="Kyselyn tila">
                <div class="quiz-meta">
                    <span id="quiz-progress"></span>
                    <span id="quiz-status"></span>
                </div>
                <p id="quiz-feedback" class="saved-feedback" aria-live="polite" hidden></p>
            </section>
            <div class="quiz-body">
                <div id="quiz-loading" class="quiz-loading">Ladataan...</div>
                <form id="quiz-form" class="quiz-form" hidden>
                    <h3 id="quiz-question"></h3>
                    <div id="quiz-options" class="quiz-options"></div>
                    <div class="quiz-actions">
                        <button id="quiz-prev" type="button">Edellinen</button>
                        <button id="quiz-next" type="button" disabled>Seuraava</button>
                    </div>
                </form>
                <section id="quiz-results" class="quiz-results" hidden>
                    <h3>Sinulle sopivin vaihtoehto</h3>
                    <div id="quiz-top" class="quiz-result-card"></div>
                    <h4>Myös tämä voi sopia</h4>
                    <div id="quiz-runner-up" class="quiz-result-card secondary"></div>
                </section>
            </div>
        </section>
    </main>
    <script type="module" src="../scripts/ulkoasu.js"></script>
    <script type="module" src="../scripts/quiz.js"></script>
    </body>
</html>
