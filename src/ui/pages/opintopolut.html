<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tutustu erilaisiin opintopolkuihin ja suunnittele oma reittisi kohti jatko-opintoja."
    />
    <title>digi-opo - opintopolut</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body data-page="opintopolut" data-subtitle="Erilaiset opintopolut">
    <a class="skip-link" href="#main-content">Siirry sisältöön</a>
    <main class="app" id="main-content">
      <div id="app-header"></div>

      <section class="panel opintopolut-page">
        <header class="page-hero">
          <div class="page-hero-copy">
            <h2>Opintopolut</h2>
            <p class="saved-page-copy">Tutustu erilaisiin reitteihin ammatillisiin opintoihin ja jatkosuuntiin yhden näkymän kautta.</p>
          </div>
          <div class="page-hero-note">
            <p class="page-hero-label">Sisältö</p>
            <p class="page-hero-meta">Tältä sivulta näet valmiita polkuja, joita voit käyttää oman suunnitelmasi pohjana.</p>
          </div>
        </header>

        <div class="detail opintopolut-detail">
          <p id="opintopolut-status" class="empty" hidden>Ladataan...</p>
          <div id="opintopolut-list" class="opintopolut-grid"></div>
        </div>
      </section>

      <footer id="app-footer" class="site-footer"></footer>
    </main>

    <script type="module" src="../scripts/layout.js"></script>
    <script type="module" src="../scripts/opintopolut.js"></script>
  </body>
</html>
