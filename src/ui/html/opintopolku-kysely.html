<!doctype html>
<html lang="fi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>digi-opo - Opintopolku-kysely</title>
        <script>
            (() => {
              const storageKey = "digi-opo.theme-mode";
              const isThemeMode = (value) => value === "auto" || value === "light" || value === "dark";
              let mode = "auto";
              try {
                const storedValue = window.localStorage.getItem(storageKey);
                if (isThemeMode(storedValue)) {
                  mode = storedValue;
                }
              } catch {
                mode = "auto";
              }
            
              const effectiveTheme = mode === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                : mode;
            
              document.documentElement.dataset.themeMode = mode;
              document.documentElement.dataset.theme = effectiveTheme;
              document.documentElement.style.colorScheme = effectiveTheme;
            })();
        </script>
        <link rel="stylesheet" href="../css/init.css" />
    </head>
    <a class="ohita-linkki" href="#paa-sisalto">Siirry sisältöön</a>
    <main class="app" id="paa-sisalto">
        <section class="paneeli paneeli-quiz">
            <header class="quiz-01">
                <div>
                    <h2>Opintopolku-kysely</h2>
                    <p class="quiz-03">Vastaukset tallentuvat myös kesken kaiken, joten voit jatkaa myöhemmin.</p>
                </div>
                <button id="quiz-04" type="button">Aloita alusta</button>
            </header>
            <section class="quiz-yleiskatsaus" aria-label="Kyselyn tila">
                <div class="quiz-tiedot">
                    <span id="quiz-05"></span>
                    <span id="quiz-06"></span>
                </div>
                <p id="quiz-feedback" class="palaute" aria-live="polite" hidden></p>
            </section>
            <div class="quiz-07">
                <div id="quiz-08" class="quiz-08">Ladataan...</div>
                <form id="quiz-09" class="quiz-09" hidden>
                    <h3 id="quiz-10"></h3>
                    <div id="quiz-11" class="quiz-11"></div>
                    <div class="quiz-12">
                        <button id="quiz-13" type="button">Edellinen</button>
                        <button id="quiz-14" type="button" disabled>Seuraava</button>
                    </div>
                </form>
                <section id="quiz-tulokset" class="quiz-tulokset" hidden>
                    <h3>Sinulle sopivin vaihtoehto</h3>
                    <div id="quiz-15" class="quiz-tulos-kortti"></div>
                    <h4>Myös tämä voi sopia</h4>
                    <div id="quiz-16" class="quiz-tulos-kortti secondary"></div>
                </section>
            </div>
        </section>
    </main>
    <script type="module" src="../ts/ulkoasu.js"></script>
    <script type="module" src="../ts/quiz.js"></script>
    </body>
</html>
