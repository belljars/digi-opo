<!doctype html>
<html lang="fi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>digi-opo</title>
        <script>
            (() => {
              const storageKey = "digi-opo.theme-mode";
              const isThemeMode = (value) => value === "auto" || value === "light" || value === "dark";
              let mode = "auto";
              try {
                const storedValue = window.localStorage.getItem(storageKey);
                if (isThemeMode(storedValue)) {
                  mode = storedValue;
                }
              } catch {
                mode = "auto";
              }

              const effectiveTheme = mode === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                : mode;

              document.documentElement.dataset.themeMode = mode;
              document.documentElement.dataset.theme = effectiveTheme;
              document.documentElement.style.colorScheme = effectiveTheme;
            })();
        </script>
        <link rel="stylesheet" href="../styles/styles.css" />
    </head>
    <body>
        <a class="skip-link" href="#main-content">Siirry sisältöön</a>
        <main class="app" id="main-content">
            <section class="workspace">
                <aside class="panel panel-list">
                    <div class="pankki-filters">
                        <div class="search">
                            <label for="tutkinto-search">Haku</label>
                            <input
                                id="tutkinto-search"
                                type="search"
                                placeholder="Hae tutkinnon nimellä tai nimikkeellä"
                                autocomplete="off"
                            />
                        </div>
                        <div class="search">
                            <label for="tutkinto-filter">Tutkinto</label>
                            <select id="tutkinto-filter">
                                <option value="">Kaikki tutkinnot</option>
                            </select>
                            <span id="paikkakunta-filter-label">Paikkakunta</span>
                            <details class="filter-dropdown" id="paikkakunta-filter-dropdown">
                                <summary
                                    id="paikkakunta-filter-trigger"
                                    class="filter-dropdown-trigger"
                                    aria-describedby="paikkakunta-filter-help"
                                >
                                    Kaikki paikkakunnat
                                </summary>
                                <div
                                    id="paikkakunta-filter"
                                    class="filter-dropdown-panel"
                                    role="group"
                                    aria-labelledby="paikkakunta-filter-label"
                                ></div>
                            </details>
                        </div>
                        <label class="filter-toggle" for="saved-only-filter">
                            <input id="saved-only-filter" type="checkbox" />
                            <span>Vain tallennetut tutkintonimikkeet</span>
                        </label>
                        <button id="clear-filters-button" type="button" class="tutkintonimike-action">
                            Tyhjennä suodattimet
                        </button>
                    </div>
                    <div id="count" class="count"></div>
                    <ul id="tutkinto-list" class="list"></ul>
                </aside>
                <section class="panel panel-detail">
                    <div id="detail-feedback" class="saved-feedback" aria-live="polite"></div>
                    <div id="detail" class="detail"></div>
                </section>
            </section>
        </main>
        <script type="module" src="../ts/ulkoasu.js"></script>
        <script type="module" src="../ts/pankki.js"></script>
    </body>
</html>
