<!doctype html>
<html lang="fi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>digi-opo</title>
        <script>
            (() => {
              const storageKey = "digi-opo.theme-mode";
              const isThemeMode = (value) => value === "auto" || value === "light" || value === "dark";
              let mode = "auto";
              try {
                const storedValue = window.localStorage.getItem(storageKey);
                if (isThemeMode(storedValue)) {
                  mode = storedValue;
                }
              } catch {
                mode = "auto";
              }

              const effectiveTheme = mode === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                : mode;

              document.documentElement.dataset.themeMode = mode;
              document.documentElement.dataset.theme = effectiveTheme;
              document.documentElement.style.colorScheme = effectiveTheme;
            })();
        </script>
        <link rel="stylesheet" href="../css/init.css" />
    </head>
    <body>
        <a class="ohita-linkki" href="#paa-sisalto">Siirry sisältöön</a>
        <main class="app" id="paa-sisalto">
            <section class="tyoalue">
                <aside class="paneeli pankki-01">
                    <div class="pankki-02">
                        <div class="haku">
                            <label for="pankki-03">Haku</label>
                            <input
                                id="pankki-03"
                                type="haku"
                                placeholder="Hae tutkinnon nimellä tai nimikkeellä"
                                autocomplete="off"
                            />
                        </div>
                        <div class="haku">
                            <label for="pankki-04">Tutkinto</label>
                            <select id="pankki-04">
                                <option value="">Kaikki tutkinnot</option>
                            </select>
                            <span id="pankki-05">Paikkakunta</span>
                            <details class="pankki-06" id="pankki-07">
                                <summary
                                    id="pankki-08"
                                    class="pankki-09"
                                    aria-describedby="pankki-10"
                                >
                                    Kaikki paikkakunnat
                                </summary>
                                <div
                                    id="pankki-11"
                                    class="pankki-12"
                                    role="group"
                                    aria-labelledby="pankki-05"
                                ></div>
                            </details>
                        </div>
                        <label class="pankki-13" for="pankki-14">
                            <input id="pankki-14" type="checkbox" />
                            <span>Vain tallennetut tutkintonimikkeet</span>
                        </label>
                        <button id="pankki-15" type="button" class="tutkintonimike-toiminto">
                            Tyhjennä suodattimet
                        </button>
                    </div>
                    <div id="maara" class="maara"></div>
                    <ul id="pankki-16" class="lista"></ul>
                </aside>
                <section class="paneeli pankki-17">
                    <div id="pankki-18" class="palaute" aria-live="polite"></div>
                    <div id="detail" class="detail"></div>
                </section>
            </section>
        </main>
        <script type="module" src="../ts/ulkoasu.js"></script>
        <script type="module" src="../ts/pankki.js"></script>
    </body>
</html>
